* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--canvas); color: var(--text); font: 14px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; }
button, input, select, textarea { font: inherit; }
button, a { -webkit-tap-highlight-color: transparent; }

.app-shell { display: grid; grid-template-columns: 184px minmax(0, 1fr); min-height: 100vh; }

nav { display: grid; gap: 5px; }
.nav-item, .navigation-index { display: flex; align-items: center; gap: 11px; border: 0; background: transparent; color: var(--secondary); padding: 10px 13px; border-radius: 6px; text-align: left; }
.nav-item[aria-current="page"] { color: var(--text); background: var(--hover); font-weight: 600; }
.nav-item[aria-current="page"] svg { color: var(--accent); }
.nav-item:hover, .navigation-index:hover { background: var(--hover); color: var(--text); }
.navigation-index { margin-top: 18px; border-top: 1px solid var(--divider); border-radius: 0; padding-top: 20px; }
.rail-footer { margin-top: auto; display: flex; gap: 8px; align-items: center; padding: 18px 13px 0; font-size: 11px; color: var(--muted); }
.local-indicator { width: 5px; height: 5px; background: var(--success); border-radius: 50%; }
.workspace { min-width: 0; display: flex; flex-direction: column; }
.workspace-bar { height: 64px; padding: 0 36px; border-bottom: 1px solid var(--divider); display: flex; justify-content: space-between; align-items: center; color: var(--secondary); font-size: 12px; }
.workspace-tools { display: flex; gap: 20px; align-items: center; }
.prototype-label { color: var(--muted); }
.skin-control { display: flex; gap: 7px; align-items: center; }
.skin-control select { font-size: 11px; max-width: 124px; border: 0; background: transparent; color: var(--secondary); padding: 4px; }
.page-layout { display: grid; grid-template-columns: minmax(0, 1fr); flex: 1; min-height: calc(100vh - 106px); align-items: stretch; }
.page-layout.has-context { grid-template-columns: minmax(0, 1fr) 326px; }
.page-layout.context-expanded { grid-template-columns: minmax(0, 1fr) 410px; }
main { min-width: 0; padding: 38px 42px 54px; }
.page-body { max-width: 1024px; margin: 0 auto; }
.page-heading { display: flex; gap: 24px; justify-content: space-between; align-items: center; margin-bottom: 28px; }
.page-heading p { margin-top: 7px; font-size: 13px; }
.button { display: inline-flex; align-items: center; justify-content: center; gap: 7px; border: 1px solid var(--line); background: var(--elevated); color: var(--text); border-radius: 6px; padding: 8px 13px; font-size: 13px; min-height: 36px; white-space: nowrap; }
.button:hover:not(:disabled) { background: var(--hover); }
.button.primary { background: var(--primary); border-color: var(--primary); color: var(--on-primary); }
.button.danger { color: var(--danger); }
.button.subtle { background: transparent; border-color: transparent; color: var(--secondary); }
.button-row { display: flex; gap: 8px; flex-wrap: wrap; }
.icon-button { width: 32px; height: 32px; padding: 5px; background: transparent; border: 0; color: var(--secondary); border-radius: 5px; display: inline-grid; place-items: center; }
.icon-button:hover:not(:disabled) { background: var(--hover); color: var(--text); }
.context-panel { border-left: 1px solid var(--divider); padding: 25px 24px 32px; min-width: 0; background: var(--surface); animation: enter-context var(--motion-panel) var(--ease); }
.context-heading { display: flex; align-items: flex-start; gap: 12px; justify-content: space-between; padding-bottom: 22px; }
.context-heading h2 { line-height: 1.6; overflow-wrap: anywhere; }
.context-heading small { display: block; margin-bottom: 4px; }
.context-controls { display: flex; gap: 2px; }
.context-section { border-top: 1px solid var(--divider); padding: 21px 0; }
.context-section > p { margin-top: 9px; font-size: 13px; line-height: 1.9; }
.context-panel .button-row { margin-top: 20px; }
.context-meta { display: grid; grid-template-columns: 72px minmax(0, 1fr); gap: 12px 15px; font-size: 12px; }
.context-meta dt { color: var(--muted); }
.context-meta dd { margin: 0; overflow-wrap: anywhere; }
.status-strip { margin: 22px 36px 0; display: grid; gap: 8px; }
.state-message { display: flex; align-items: center; gap: 12px; padding: 11px 15px; border: 1px solid var(--line); background: var(--surface); border-radius: 6px; }
.state-message .state-copy { flex: 1; min-width: 0; }
.state-copy strong { font-size: 13px; display: block; }
.state-copy p { font-size: 12px; line-height: 1.7; margin-top: 2px; }
.state-message[data-severity="warning"] { background: var(--warning-bg); color: var(--warning); }
.state-message[data-severity="error"] { background: var(--danger-bg); color: var(--danger); }
.state-message .button { flex: none; }
.state-message[data-state="dirty"] { background: var(--canvas); }
.prototype-footer { display: flex; justify-content: space-between; gap: 18px; padding: 12px 36px; border-top: 1px solid var(--divider); font-size: 11px; color: var(--muted); }
.home-body { max-width: 820px; padding-top: 20px; }
.home-title { margin-bottom: 25px; }
.home-title h1 { font-size: 32px; }
.home-title p { margin-top: 10px; }
.search-field { position: relative; }
.search-field > svg { position: absolute; left: 15px; top: 14px; color: var(--muted); }
.search-field input { width: 100%; background: var(--elevated); border: 1px solid var(--line); border-radius: var(--radius); padding: 13px 45px 13px 44px; color: var(--text); }
.search-field .icon-button { position: absolute; right: 7px; top: 7px; }
.search-disclosure { margin-top: 8px; font-size: 11px; color: var(--muted); }
.home-section { margin-top: 38px; }
.section-heading { display: flex; justify-content: space-between; align-items: center; margin-bottom: 13px; }
.section-heading h2 { font-size: 13px; color: var(--secondary); font-weight: 550; }
.recent-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 9px 20px; }
.recent-item { display: flex; align-items: center; gap: 12px; width: 100%; border: 1px solid transparent; background: transparent; border-radius: 7px; padding: 14px 12px; text-align: left; color: var(--text); }
.recent-item:hover { background: var(--surface); }
.recent-item[aria-pressed="true"] { border-color: var(--line); background: var(--surface); }
.object-mark { width: 34px; height: 34px; border: 1px solid var(--divider); border-radius: 8px; display: grid; place-items: center; color: var(--secondary); background: var(--surface); flex: none; }
.recent-copy { flex: 1; min-width: 0; }
.recent-copy strong { display: block; font-size: 13px; font-weight: 570; overflow-wrap: anywhere; }
.recent-copy small { display: block; font-size: 11px; margin-top: 3px; }
.entry-links { display: flex; gap: 19px; padding-top: 5px; }
.entry-link { display: inline-flex; gap: 7px; align-items: center; color: var(--secondary); font-size: 12px; background: transparent; border: 0; padding: 5px 0; }
.entry-link:hover { color: var(--link); }
.list-tools { display: flex; gap: 12px; align-items: center; margin-bottom: 18px; }
.list-tools .search-field { flex: 1; max-width: 360px; }
.list-tools .search-field input { padding-top: 9px; padding-bottom: 9px; font-size: 12px; }
.list-tools .search-field > svg { top: 11px; width: 16px; height: 16px; }
.list-tools select { padding: 8px 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--canvas); color: var(--secondary); font-size: 12px; }
.task-table { border-top: 1px solid var(--line); }
.table-head, .task-row { display: grid; grid-template-columns: minmax(210px, 1.8fr) minmax(92px, 1fr) 90px 78px; gap: 18px; align-items: center; }
.table-head { color: var(--muted); font-size: 11px; padding: 12px 12px; border-bottom: 1px solid var(--divider); }
.task-row { background: transparent; color: var(--text); border: 0; border-bottom: 1px solid var(--divider); width: 100%; padding: 18px 12px; text-align: left; border-radius: 0; min-height: 80px; }
.task-row:hover { background: var(--surface); }
.task-row[aria-pressed="true"] { background: var(--accent-soft); box-shadow: inset 2px 0 var(--accent); }
.row-title { display: block; font-weight: 560; font-size: 13px; }
.row-subtitle { display: block; margin-top: 3px; font-size: 11px; color: var(--muted); }
.row-project, .row-time { font-size: 12px; color: var(--secondary); }
.state-badge { display: inline-flex; gap: 6px; align-items: center; font-size: 11px; color: var(--secondary); white-space: nowrap; }
.state-badge::before { content: ''; width: 5px; height: 5px; border-radius: 50%; background: currentColor; }
.state-badge[data-state="waiting"], .state-badge[data-state="recovery"] { color: var(--warning); }
.state-badge[data-state="success"] { color: var(--success); }
.empty-result { padding: 48px 12px; font-size: 13px; }
.form-body { max-width: 770px; }
.form-section { padding: 27px 0; border-bottom: 1px solid var(--divider); }
.form-section:first-of-type { padding-top: 7px; }
.form-section h2 { margin-bottom: 18px; font-size: 14px; }
.field { display: grid; gap: 8px; margin-bottom: 20px; font-size: 12px; color: var(--secondary); }
.field:last-child { margin-bottom: 0; }
.field input, .field textarea, .field select { width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--canvas); color: var(--text); min-width: 0; }
.field textarea { resize: vertical; min-height: 145px; line-height: 1.8; }
.field small { line-height: 1.7; font-size: 11px; }
.field-pair { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
.advanced-row { display: flex; justify-content: space-between; align-items: center; padding: 23px 0; font-size: 12px; color: var(--secondary); }
.form-footer { display: flex; justify-content: flex-end; gap: 10px; margin-top: 26px; }

.question-choice { display: flex; gap: 9px; align-items: center; font-size: 12px; margin: 9px 0; }
.task-question .button-row { margin-top: 17px; }

.timeline-item > div { flex: 1; }
.timeline-item p { font-size: 12px; margin-top: 5px; }
.timeline-item .state-badge { margin-top: 4px; }

.settings-group { width: 100%; display: flex; gap: 16px; align-items: center; padding: 23px 16px; border: 0; border-bottom: 1px solid var(--divider); background: transparent; color: var(--text); text-align: left; }

input[type="checkbox"], input[type="radio"] { accent-color: var(--accent); }

.navigation-route:hover { color: var(--accent); }
.route-location { font: 12px/1.7 ui-monospace, SFMono-Regular, Consolas, monospace; color: var(--secondary); overflow-wrap: anywhere; background: var(--canvas); border: 1px solid var(--divider); border-radius: 5px; padding: 10px; margin: 14px 0; }
.conflict-copy { border-left: 2px solid var(--warning); padding-left: 12px; font-size: 12px; margin: 14px 0; }
dialog { width: 480px; max-width: calc(100vw - 80px); border: 1px solid var(--line); border-radius: 11px; padding: 25px 28px; background: var(--elevated); color: var(--text); box-shadow: var(--shadow); }

dialog p { font-size: 13px; line-height: 1.9; }
.dialog-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 25px; }
.feedback { position: fixed; right: 30px; bottom: 25px; max-width: 440px; background: var(--elevated); border: 1px solid var(--line); border-radius: 8px; box-shadow: var(--shadow); padding: 12px 16px; font-size: 12px; z-index: 30; }
@keyframes enter-context { from { opacity: 0; transform: translateX(8px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; } }

  "guards": {
    "BLOCK_PENDING": "SENDING/busy/UNKNOWN 顶层或子操作仍拥有 key/body/version/File 时，拒绝销毁 owner 或发不同新写；关闭保留 owner 的纯展示可以允许；原身份只读/受支持原操作恢复单列",
    "CONFIRM_DIRTY": "普通未发送 dirty 草稿或 File 离开需显式确认；选择留在页面保持原输入，确认放弃才导航；不能覆盖 BLOCK_PENDING",
    "OWNER_RETAINED": "只收起展示并保留操作 controller 及全部身份；若生命周期会销毁 owner，执行与路由离开相同的 BLOCK_PENDING/CONFIRM_DIRTY",
    "SERVER_AUTHORITY": "生命周期/许可/能力/version/冻结范围由服务端持有；按钮可见不构成授权",
    "CONFIRM_DESTRUCTIVE": "写出具体目标和不可逆/停止/覆盖影响后明确确认；确认本身不证明成功",
    "SAME_IDENTITY": "固定原 route owner、key、endpoint、body、expectedVersion/model/revision、File 实例或已核实相同 bytes/hash/order；不以 metadata 代替 bytes",
    "RETRY_UNKNOWN_ONLY": "仅未确认接受且原身份完整、原接口支持时重试原操作；已接受后读失败只读；无 key 不能补造 key 重发",
    "STOP_PROOF": "abort true、精确不存在或独立终态才证明停止；未知保留阻断和租约，不能启动重叠 writer",
    "EXPLICIT_DIRTY_DECISION": "由 dirty 确认明确选择放弃修改，仅丢弃本地未发送草稿",
    "BLOCK_UNHANDED_ACCEPTED": "命令已接受但结果/导航目标尚未可靠交接给仍存活的 owner 时，先阻止销毁当前 owner；已接受后的读取失败仅重读，不重新 POST。只有真实支持的身份交接或安全读恢复可解除"
  },
