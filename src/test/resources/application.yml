spring:
  ai:
    mcp:
      server:
        annotation-scanner:
          enabled: false
        protocol: STREAMABLE
        capabilities:
          tool: true
          resource: false
          prompt: false
          completion: false
  datasource:
    url: jdbc:sqlite:file:loopper-test?mode=memory&cache=shared
  flyway:
    clean-disabled: false
mybatis:
  configuration:
    # Keep integration tests on the same constructor-mapping contract as the
    # production JAR. Column-order fallback previously hid a real HTTP 500.
    map-underscore-to-camel-case: true
    arg-name-based-constructor-auto-mapping: true
loopper:
  data-dir: ${java.io.tmpdir}/loopper-test-data
  # Integration tests invoke monitor beans directly. Automatic polling would
  # race Flyway clean/migrate against the shared in-memory SQLite schema.
  scheduling:
    enabled: false
  # Startup recovery is a separate ApplicationReady side effect. Integration
  # tests invoke recovery methods explicitly against their own prepared rows.
  startup-recovery:
    enabled: false
  monitor-delay: 1h
  opencode:
    mode: fake
