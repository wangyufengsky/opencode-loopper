spring:
  application:
    name: opencode-loopper
  ai:
    mcp:
      server:
        annotation-scanner:
          # ToolCallbackProvider below is the single source of the six tools;
          # do not also start an empty annotation scanner.
          enabled: false
        protocol: STREAMABLE
        name: opencode-loopper
        version: 0.3.13
        type: SYNC
        instructions: >-
          Use the six Loopper tools only. Designer access is READ_ONLY; proposals synchronize
          the session-bound DRAFT_READY LoopSpec and require human confirmation before create_task.
        capabilities:
          tool: true
          resource: false
          prompt: false
          completion: false
        streamable-http:
          # Keep /api/mcp as the backward-compatible JSON-RPC endpoint while Spring AI
          # owns this protocol-native Streamable HTTP transport.
          mcp-endpoint: /api/mcp-streamable
          disallow-delete: true
  datasource:
    url: jdbc:sqlite:${LOOPPER_DATA_DIR:./data}/loopper.db?foreign_keys=on&busy_timeout=5000&journal_mode=WAL
    driver-class-name: org.sqlite.JDBC
  flyway:
    locations: classpath:db/migration
    baseline-on-migrate: true
  mvc:
    problemdetails:
      enabled: true
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 50MB
  task:
    scheduling:
      # Task and Designer monitors must not starve each other. Deterministic
      # verifiers run on their own bounded worker pool as an additional boundary.
      pool:
        size: 2

server:
  address: 127.0.0.1
  port: ${SERVER_PORT:8080}
  compression:
    enabled: true
    min-response-size: 2KB
    mime-types: application/json,application/problem+json,text/plain,text/html,text/css,application/javascript

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

mybatis:
  configuration:
    map-underscore-to-camel-case: true
    arg-name-based-constructor-auto-mapping: true

loopper:
  data-dir: ${LOOPPER_DATA_DIR:./data}
  scheduling:
    enabled: true
  startup-recovery:
    enabled: true
  max-stage-attempts: ${LOOPPER_MAX_STAGE_ATTEMPTS:3}
  max-task-attempts: ${LOOPPER_MAX_TASK_ATTEMPTS:12}
  session-error-limit: ${LOOPPER_SESSION_ERROR_LIMIT:3}
  max-duration: ${LOOPPER_MAX_DURATION:2h}
  allowed-root: ${LOOPPER_ALLOWED_ROOT:}
  attempt-timeout: ${LOOPPER_ATTEMPT_TIMEOUT:30m}
  verifier-timeout: ${LOOPPER_VERIFIER_TIMEOUT:10m}
  monitor-delay: ${LOOPPER_MONITOR_DELAY:2s}
  workspace-lease-reconcile-delay: 10s
  designer-monitor-delay: ${LOOPPER_DESIGNER_MONITOR_DELAY:750ms}
  designer-timeout: ${LOOPPER_DESIGNER_TIMEOUT:30m}
  task-profile-router-timeout: ${LOOPPER_TASK_PROFILE_ROUTER_TIMEOUT:240s}
  rolling-packages-enabled: ${LOOPPER_ROLLING_PACKAGES_ENABLED:true}
  # A Task may be terminal while its last remote writer still needs best-effort
  # cleanup. These bounded, persisted retries never start another Session.
  abort-cleanup-attempts: ${LOOPPER_ABORT_CLEANUP_ATTEMPTS:3}
  retry-wait:
    rate-limit-base: ${LOOPPER_RETRY_RATE_LIMIT_BASE:60s}
    rate-limit-max: ${LOOPPER_RETRY_RATE_LIMIT_MAX:300s}
    session-base: ${LOOPPER_RETRY_SESSION_BASE:10s}
    session-max: ${LOOPPER_RETRY_SESSION_MAX:60s}
    verification-base: ${LOOPPER_RETRY_VERIFICATION_BASE:5s}
    verification-max: ${LOOPPER_RETRY_VERIFICATION_MAX:30s}
  mcp:
    bearer-token: ${LOOPPER_MCP_BEARER_TOKEN:}
  internal-candidate:
    decomposer-enabled: ${LOOPPER_DECOMPOSER_CANDIDATE_ENABLED:true}
    # Qualified MCP-first package design is the default; set false for an operational rollback.
    package-design-v1-enabled: ${LOOPPER_PACKAGE_DESIGN_CANDIDATE_V1_ENABLED:true}
    # Qualified MCP-first acceptance selection is the default; set false for an operational rollback.
    acceptance-closed-choice-v7-enabled: ${LOOPPER_ACCEPTANCE_CLOSED_CHOICE_V7_ENABLED:true}
    # Qualified MCP-first rolling-plan submission is the default; set false for an operational rollback.
    rolling-package-plan-v1-enabled: ${LOOPPER_ROLLING_PACKAGE_PLAN_V1_ENABLED:true}
    # Reviewer MCP candidate remains a qualification-only path until real-model evidence exists.
    reviewer-report-v1-enabled: ${LOOPPER_REVIEWER_REPORT_CANDIDATE_V1_ENABLED:false}
  publication:
    # Comma-separated exact hosts. Only ambiguous SSH remotes use HTTP; an
    # explicit http:// or https:// remote always keeps its declared scheme.
    http-web-hosts: ${LOOPPER_PUBLICATION_HTTP_WEB_HOSTS:}
    gitlab:
      host: ${LOOPPER_GITLAB_HOST:}
      api-base-url: ${LOOPPER_GITLAB_API_BASE_URL:}
      private-token: ${LOOPPER_GITLAB_PRIVATE_TOKEN:}
      connect-timeout: ${LOOPPER_GITLAB_CONNECT_TIMEOUT:3s}
      request-timeout: ${LOOPPER_GITLAB_REQUEST_TIMEOUT:10s}
  opencode:
    # managed always owns one dedicated localhost process; Sessions reuse that process.
    # auto/http retain legacy external-server behavior; fake is for tests.
    mode: ${LOOPPER_OPENCODE_MODE:managed}
    base-url: ${OPENCODE_BASE_URL:http://127.0.0.1:4096}
    username: ${OPENCODE_USERNAME:${OPENCODE_SERVER_USERNAME:}}
    password: ${OPENCODE_PASSWORD:${OPENCODE_SERVER_PASSWORD:}}
    executable: ${OPENCODE_EXECUTABLE:}
    model: ${OPENCODE_MODEL:}
    connect-timeout: ${LOOPPER_OPENCODE_CONNECT_TIMEOUT:5s}
    request-timeout: ${LOOPPER_OPENCODE_REQUEST_TIMEOUT:30s}
    startup-timeout: ${LOOPPER_OPENCODE_STARTUP_TIMEOUT:15s}
