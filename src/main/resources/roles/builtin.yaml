roles:
  - roleId: builtin.source-design-author
    displayName: 源码详细设计作者
    description: 按选定的源码文件逐一阅读，编写包含模块职责、接口、流程和来源依据的详细设计。
    groupKey: source-design
    groupLabel: 源码详细设计
    allowedSlots:
      - SOURCE_DETAILED_DESIGN_NO_TOOLS
    permissionMode: BASELINE
    nativeTools: []
    mcpTools: []
    requiredMcpTools: []
    modelPolicy: INHERIT_WORKFLOW
    runtimePolicy: WORKFLOW_ADAPTER
    prompts:
      source.design.author.instructions: source.design.author.instructions
  - roleId: builtin.source-design-review
    displayName: 源码详细设计复核员
    description: 独立核对源码与详细设计，找出遗漏、错误及跨模块矛盾，提出返修意见。
    groupKey: source-design
    groupLabel: 源码详细设计
    allowedSlots:
      - SOURCE_DESIGN_REVIEW_NO_TOOLS
    permissionMode: BASELINE
    nativeTools: []
    mcpTools: []
    requiredMcpTools: []
    modelPolicy: INHERIT_WORKFLOW
    runtimePolicy: WORKFLOW_ADAPTER
    prompts:
      source.design.reviewer.instructions: source.design.reviewer.instructions
