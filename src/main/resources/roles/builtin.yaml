roles:
  - roleId: builtin.ppt
    displayName: PPT 制作助手
    description: 围绕制作目标和提供的资料讨论内容，按确认的要求生成、修改并交付演示文稿。
    groupKey: ppt
    groupLabel: PPT 制作助手
    allowedSlots:
      - PPT_AGENT
    capabilities: []
    permissionMode: BASELINE
    nativeTools: []
    mcpTools: []
    requiredMcpTools: []
    modelPolicy: INHERIT_WORKFLOW
    runtimePolicy: WORKFLOW_ADAPTER
    prompts:
      ppt.base: ppt.base
      ppt.manual: ppt.manual
      ppt.discussion: ppt.discussion
      ppt.automatic: ppt.automatic
      ppt.knowledge: ppt.knowledge
      ppt.request-write-rules: ppt.request-write-rules
      ppt.bounded-context: ppt.bounded-context
      ppt.discussion-boundary: ppt.discussion-boundary
      ppt.manual-authorization: ppt.manual-authorization
  - roleId: builtin.knowledge
    workInstructions: 根据本节点目标检索已授权项目知识，先定位再读取原文，保存并引用真实证据。交付有来源位置、内容版本与局限的结论；区分补充背景和本节点固定输入，不把无命中或未读完的分页说成资料不存在。
    displayName: 知识库助手
    description: 从项目授权资料中检索并阅读原文，回答问题、继续追问并给出可核对的引用。
    groupKey: knowledge
    groupLabel: 知识库助手
    allowedSlots:
      - WORKFLOW_READ_ONLY
      - KNOWLEDGE_READ_ONLY
      - KNOWLEDGE_INTERACTIVE_READ_ONLY
      - KNOWLEDGE_RESEARCH_READ_ONLY
      - KNOWLEDGE_RESEARCH_INTERACTIVE_READ_ONLY
    capabilities: [DATABASE_READ, KNOWLEDGE_CONVERSATION, NATIVE_TOOLS, PROJECT_KNOWLEDGE]
    permissionMode: BASELINE
    nativeTools: []
    mcpTools: []
    requiredMcpTools: []
    modelPolicy: INHERIT_WORKFLOW
    runtimePolicy: WORKFLOW_ADAPTER
    prompts:
      knowledge.research: knowledge.research
  - roleId: builtin.router
    displayName: 任务分类器
    description: 根据用户需求提出任务类型、主要交付物和复杂度分类，帮助选择后续工作流程。
    groupKey: router
    groupLabel: 任务分类器
    allowedSlots:
      - ROUTER_NO_TOOLS
    capabilities: []
    permissionMode: BASELINE
    nativeTools: []
    mcpTools: []
    requiredMcpTools: []
    modelPolicy: INHERIT_WORKFLOW
    runtimePolicy: WORKFLOW_ADAPTER
    prompts: {}
  - roleId: builtin.template
    displayName: 模板分析角色
    description: 按批次分析代码变化和贡献证据，形成代码评审或贡献报告的依据。
    workInstructions: 完整读取本批冻结历史证据，按变更片段逐项审查并提交可定位的问题和局限；贡献评价只依据固定身份及本人证据给出四维等级，不自行计算分数或排名。排除的正文和静态分析无法证明的结果须如实说明。
    groupKey: template
    groupLabel: 模板分析角色
    allowedSlots:
      - TEMPLATE_ANALYSIS_NO_TOOLS
      - TEMPLATE_ANALYSIS_CANDIDATE_NO_TOOLS
      - WORKFLOW_READ_ONLY
    capabilities: [DATABASE_READ, DOCUMENT_READ, GITLAB_READ, PROJECT_KNOWLEDGE, TASK_EVIDENCE]
    permissionMode: BASELINE
    nativeTools: []
    mcpTools: []
    requiredMcpTools: []
    modelPolicy: INHERIT_WORKFLOW
    runtimePolicy: WORKFLOW_ADAPTER
    prompts: {}
  - roleId: builtin.snapshot-review
    displayName: 源码评审角色
    description: 审查指定版本的代码变化与上下文，提出有源码证据支持的问题和复核结论。
    workInstructions: 审查本批固定版本的完整代码资料，聚焦有触发条件、错误行为和实际源码引用的缺陷。遵守 V3 容量与关联读取边界，不运行项目命令、不修改代码。独立复核仅逐项判定绑定分析中的候选问题，不自行扩展另一轮全面搜索；证据不足时明确记录局限。节点工作查询持有专用输入、引用和提交结构。
    groupKey: snapshot-review
    groupLabel: 源码评审角色
    allowedSlots:
      - SNAPSHOT_CODE_REVIEW_NO_TOOLS
      - WORKFLOW_READ_ONLY
    capabilities: [PROJECT_KNOWLEDGE]
    permissionMode: BASELINE
    nativeTools: []
    mcpTools: []
    requiredMcpTools: []
    modelPolicy: INHERIT_WORKFLOW
    runtimePolicy: WORKFLOW_ADAPTER
    prompts: {}
  - roleId: builtin.decomposer
    displayName: 任务规划师
    description: 为大型任务划分范围清楚且有依赖顺序的工作包，标出需要用户补充的需求。
    groupKey: decomposer
    groupLabel: 任务规划师
    allowedSlots:
      - DECOMPOSER_CANDIDATE_READ_ONLY
      - DECOMPOSER_READ_ONLY
    capabilities: [DATABASE_READ, DOCUMENT_READ, EXTERNAL_MCP, GITLAB_READ, KNOWLEDGE_DATABASE_METADATA, NATIVE_TOOLS, PROJECT_KNOWLEDGE, TASK_EVIDENCE]
    permissionMode: BASELINE
    nativeTools: []
    mcpTools: []
    requiredMcpTools: []
    modelPolicy: INHERIT_WORKFLOW
    runtimePolicy: WORKFLOW_ADAPTER
    prompts:
      machine-role.decomposer: machine-role.decomposer
  - roleId: builtin.package-designer
    displayName: 工作包设计师
    description: 将工作包需求细化为阶段目标、交付物和验收场景，并通过讨论修正缺口。
    groupKey: package-designer
    groupLabel: 工作包设计师
    allowedSlots:
      - PACKAGE_DESIGN_CANDIDATE_READ_ONLY
      - PACKAGE_DESIGN_CANDIDATE_V2_READ_ONLY
      - PACKAGE_DESIGN_CANDIDATE_V2_INTERACTIVE_READ_ONLY
      - PACKAGE_DESIGN_CANDIDATE_INTERACTIVE_READ_ONLY
    capabilities: [DATABASE_READ, DOCUMENT_READ, GITLAB_READ, KNOWLEDGE_DATABASE_METADATA, NATIVE_TOOLS, PROJECT_KNOWLEDGE, TASK_EVIDENCE]
    permissionMode: BASELINE
    nativeTools: []
    mcpTools: []
    requiredMcpTools: []
    modelPolicy: INHERIT_WORKFLOW
    runtimePolicy: WORKFLOW_ADAPTER
    prompts:
      machine-role.package-designer: machine-role.package-designer
  - roleId: builtin.acceptance
    displayName: 验收闭集选择器
    description: 在已列出的等价验收方案中选择一项，供后续设计采用。
    groupKey: acceptance
    groupLabel: 验收闭集选择器
    allowedSlots:
      - ACCEPTANCE_CLOSED_CHOICE_CANDIDATE_NO_TOOLS
    capabilities: []
    permissionMode: BASELINE
    nativeTools: []
    mcpTools: []
    requiredMcpTools: []
    modelPolicy: INHERIT_WORKFLOW
    runtimePolicy: WORKFLOW_ADAPTER
    prompts: {}
  - roleId: builtin.rolling-planner
    displayName: 滚动计划师
    description: 根据已完成工作的结果和剩余需求，建议后续工作包的范围、顺序与依赖，供用户确认。
    groupKey: rolling-planner
    groupLabel: 滚动计划师
    allowedSlots:
      - ROLLING_PACKAGE_CANDIDATE_READ_ONLY
    capabilities: [DATABASE_READ, DOCUMENT_READ, GITLAB_READ, KNOWLEDGE_DATABASE_METADATA, NATIVE_TOOLS, PROJECT_KNOWLEDGE, TASK_EVIDENCE]
    permissionMode: BASELINE
    nativeTools: []
    mcpTools: []
    requiredMcpTools: []
    modelPolicy: INHERIT_WORKFLOW
    runtimePolicy: WORKFLOW_ADAPTER
    prompts: {}
  - roleId: builtin.reviewer
    displayName: 评审员
    description: 检查实现与验证材料，指出有证据支持的问题和具体修正建议。
    groupKey: reviewer
    groupLabel: 评审员
    allowedSlots:
      - REVIEWER_CANDIDATE_READ_ONLY
      - REVIEWER_READ_ONLY
    capabilities: [NATIVE_TOOLS, PROJECT_KNOWLEDGE, TASK_EVIDENCE]
    permissionMode: BASELINE
    nativeTools: []
    mcpTools: []
    requiredMcpTools: []
    modelPolicy: INHERIT_WORKFLOW
    runtimePolicy: WORKFLOW_ADAPTER
    prompts: {}
  - roleId: builtin.convention
    displayName: 规范工程师
    description: 基于项目现有结构和可用命令，整理可供预览的开发约定与执行说明。
    groupKey: convention
    groupLabel: 规范工程师
    allowedSlots:
      - PROJECT_CONVENTION_CANDIDATE_READ_ONLY
      - PROJECT_CONVENTION_READ_ONLY
    capabilities: [EXTERNAL_MCP, NATIVE_TOOLS, PROJECT_KNOWLEDGE]
    permissionMode: BASELINE
    nativeTools: []
    mcpTools: []
    requiredMcpTools: []
    modelPolicy: INHERIT_WORKFLOW
    runtimePolicy: WORKFLOW_ADAPTER
    prompts: {}
  - roleId: builtin.judge
    displayName: 验收工程师
    description: 对照任务目标、设计和验证证据，给出是否达到验收条件的判断与理由。
    groupKey: judge
    groupLabel: 验收工程师
    allowedSlots:
      - JUDGE_CANDIDATE_READ_ONLY
      - JUDGE_READ_ONLY
      - JUDGE_FINALIZER_NO_TOOLS
    capabilities: [NATIVE_TOOLS, PROJECT_KNOWLEDGE, TASK_EVIDENCE]
    permissionMode: BASELINE
    nativeTools: []
    mcpTools: []
    requiredMcpTools: []
    modelPolicy: INHERIT_WORKFLOW
    runtimePolicy: WORKFLOW_ADAPTER
    prompts:
      machine-role.judge: machine-role.judge
  - roleId: builtin.designer
    workInstructions: 根据本节点的任务和资料，说明设计依据、方案、交付物与可验证的完成条件。需要拆解工作时明确阶段及依赖；将不确定事项如实标出，不把候选计划视为用户已确认的安排。
    displayName: 设计师
    description: 根据已确认的需求设计工作阶段、交付物和验收目标，并在讨论中完善方案。
    groupKey: designer
    groupLabel: 设计师
    allowedSlots:
      - DESIGNER_INTERACTIVE_READ_ONLY
      - GENERAL_READ_ONLY_DESIGNER
      - DESIGNER_INTERACTIVE_READ_ONLY_DESIGNER
      - WORKFLOW_READ_ONLY
    capabilities: [DATABASE_READ, DOCUMENT_READ, EXTERNAL_MCP, GITLAB_READ, KNOWLEDGE_DATABASE_METADATA, NATIVE_TOOLS, PROJECT_KNOWLEDGE, TASK_EVIDENCE]
    permissionMode: BASELINE
    nativeTools: []
    mcpTools: []
    requiredMcpTools: []
    modelPolicy: INHERIT_WORKFLOW
    runtimePolicy: WORKFLOW_ADAPTER
    prompts:
      machine-role.designer: machine-role.designer
  - roleId: builtin.document
    displayName: 文档模板角色
    description: 阅读上传文档，提取并复核需求；需要评估代码时，逐项核对实现与原文依据。
    groupKey: document
    groupLabel: 文档模板角色
    workInstructions: 按本节点指定的冻结原文与代码评估需求实现。逐项提供原文位置、实际读取的代码证据、实现结论与局限；有业务歧义时保留无法判断。独立复核须重新阅读原文、代码和本次关联稿，检查遗漏与跨批次矛盾。静态评审不运行测试，不把代码中存在测试视为本次测试通过。
    allowedSlots:
      - WORKFLOW_READ_ONLY
      - DOCUMENT_CODE_ASSESSMENT_V2_NO_TOOLS
      - DOCUMENT_CODE_REVIEW_V2_NO_TOOLS
      - DOCUMENT_REQUIREMENTS_NO_TOOLS
      - DOCUMENT_REQUIREMENT_REVIEW_NO_TOOLS
      - REQUIREMENT_CODE_ASSESSMENT_NO_TOOLS
      - REQUIREMENT_ASSESSMENT_REVIEW_NO_TOOLS
    capabilities: [PROJECT_KNOWLEDGE]
    permissionMode: BASELINE
    nativeTools: []
    mcpTools: []
    requiredMcpTools: []
    modelPolicy: INHERIT_WORKFLOW
    runtimePolicy: WORKFLOW_ADAPTER
    prompts: {}
  - roleId: builtin.compiler
    displayName: 设计编译器
    description: 在设计方案的阶段或验收条件存在歧义时，提出明确选择或修正建议，供后续执行准备。
    groupKey: compiler
    groupLabel: 设计编译器
    allowedSlots:
      - COMPILER_READ_ONLY
      - COMPILER_BINDING_NO_TOOLS
      - COMPILER_REPAIR_NO_TOOLS
    capabilities: [DATABASE_READ, DOCUMENT_READ, EXTERNAL_MCP, GITLAB_READ, KNOWLEDGE_DATABASE_METADATA, NATIVE_TOOLS, PROJECT_KNOWLEDGE, TASK_EVIDENCE]
    permissionMode: BASELINE
    nativeTools: []
    mcpTools: []
    requiredMcpTools: []
    modelPolicy: INHERIT_WORKFLOW
    runtimePolicy: WORKFLOW_ADAPTER
    prompts:
      machine-role.compiler: machine-role.compiler
      machine-role.legacy-compiler: machine-role.legacy-compiler
      machine-role.legacy-semantic-compiler: machine-role.legacy-semantic-compiler
      machine-role.closed-choice-compiler: machine-role.closed-choice-compiler
  - roleId: builtin.finalizer
    displayName: 结果整理助手
    description: 整理规划或设计过程中已有的结果，使当前流程能够继续检查和确认。
    groupKey: finalizer
    groupLabel: 结果整理助手
    allowedSlots:
      - MACHINE_FINALIZER_NO_TOOLS
