name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            command: ./mvnw
          - os: macos-latest
            command: ./mvnw
          - os: windows-latest
            command: .\mvnw.cmd
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Verify
        if: runner.os != 'Windows'
        run: ${{ matrix.command }} -B clean verify
      - name: Verify Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\scripts\verify-windows-ci.ps1
      - name: Preserve Windows verification diagnostics
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-verification
          retention-days: 7
          path: |
            windows-verify.log
            windows-threads-*.log
            windows-threads-*.err
            target/surefire-reports/
