name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  validate-windows-script:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate Windows startup script
        shell: cmd
        run: scripts\start-windows.bat --validate

  release:
    needs: validate-windows-script
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Resolve and validate version
        id: version
        shell: bash
        run: |
          VERSION="$(./mvnw -q help:evaluate -Dexpression=project.version -DforceStdout)"
          EXPECTED_TAG="v$VERSION"
          if [[ "$GITHUB_REF_NAME" != "$EXPECTED_TAG" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match Maven version $VERSION" >&2
            exit 1
          fi
          if [[ "$VERSION" == *-SNAPSHOT ]]; then
            echo "Stable release workflow rejects SNAPSHOT version $VERSION" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "jar_name=opencode-loopper-$VERSION.jar" >> "$GITHUB_OUTPUT"

      - name: Verify and package
        run: ./mvnw -B clean verify

      - name: Prepare release assets
        shell: bash
        run: |
          JAR="target/${{ steps.version.outputs.jar_name }}"
          test -s "$JAR"
          bash -n scripts/start-linux.sh
          mkdir -p target/release
          cp "$JAR" target/release/
          cp scripts/start-linux.sh target/release/
          cp scripts/start-windows.bat target/release/
          (
            cd target/release
            sha256sum "${{ steps.version.outputs.jar_name }}" start-linux.sh start-windows.bat > SHA256SUMS
          )

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "target/release/${{ steps.version.outputs.jar_name }}#OpenCode Loopper ${{ steps.version.outputs.version }} executable JAR" \
            "target/release/start-linux.sh#Linux intranet startup script" \
            "target/release/start-windows.bat#Windows startup script" \
            "target/release/SHA256SUMS#SHA-256 checksums" \
            --verify-tag \
            --title "OpenCode Loopper ${{ steps.version.outputs.version }}" \
            --generate-notes
