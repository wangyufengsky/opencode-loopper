name: Windows sharded qualification

on:
  push:
    branches: [codex/workflow-studio]
    paths:
      - .github/workflows/windows-sharded-qualification.yml
      - .github/diagnostics/windows-shards.*

permissions:
  contents: read

jobs:
  shards:
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Prepare fixed candidate test partition
        run: python .github/diagnostics/windows-shards.py prepare ${{ matrix.shard }}
      - name: Verify complete build with the selected test classes
        shell: pwsh
        run: '& "$env:RUNNER_TEMP/loopper-shard-wrapper.ps1"'
      - name: Verify selected test coverage
        run: python .github/diagnostics/windows-shards.py verify ${{ matrix.shard }}
      - name: Preserve diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-shard-${{ matrix.shard }}
          retention-days: 7
          path: |
            windows-verify.log
            windows-threads-*.log
            windows-threads-*.err
            windows-shard-result.json
            target/surefire-reports/
  coverage:
    needs: shards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: windows-shard-*
          path: diagnostics-artifacts
      - name: Verify all original test classes ran exactly once
        run: python3 .github/diagnostics/windows-shards.py aggregate
