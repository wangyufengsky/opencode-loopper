name: Windows fix qualification
on:
  push:
    branches: [codex/workflow-studio]
    paths: [.github/workflows/windows-fix-qualification.yml]
permissions:
  contents: read
jobs:
  focused:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Verify all observed Windows regressions
        shell: pwsh
        run: .\mvnw.cmd -B -Pbackend-dev "-Dtest=SourceTemplateMigrationTest,DurableCommandsTest,OpenCodeRuntimeManagerTest,ProjectStackProfileServiceTest,ProjectStackProfileOrderMigrationTest,WorkflowSourceDesignIntegrationTest,SourceDesignBatchesTest" test
      - name: Preserve test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fixes-${{ matrix.os }}
          path: target/backend-dev/surefire-reports/
  process-control:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: "21"
      - name: Isolate repeated native process startup from product tests
        shell: pwsh
        run: java .github/diagnostics/WindowsProcessProbe.java
