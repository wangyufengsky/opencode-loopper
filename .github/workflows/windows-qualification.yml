name: Windows qualification

on:
  push:
    branches: [codex/workflow-studio]

permissions:
  contents: read

jobs:
  focused:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Reproduce Windows failures
        run: .\mvnw.cmd -B -Pbackend-dev "-Dtest=SourceTemplateMigrationTest,DurableCommandsTest,OpenCodeRuntimeManagerTest" test
